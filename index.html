<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 文本阅读器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f3f5;
            color: #25282a;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100%;
        }
        .toolbar {
            position: sticky;
            top: 0;
            background-color: #323639;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
            gap: 16px;
        }
        .toolbar h1 {
            font-size: 16px;
            font-weight: 500;
            white-space: nowrap;
        }
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            overflow: hidden;
            flex: 0 0 auto;
        }
        .btn {
            border: 1px solid #4d5154;
            color: #fff;
            background-color: #282c2f;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #42474a;
        }
        .btn:focus-within, .btn:focus-visible {
            outline: 2px solid #8ec5ff;
            outline-offset: 2px;
        }
        .file-input-wrapper input[type=file] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }
        .toolbar-actions[hidden] {
            display: none;
        }
        .translation-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .translation-nav[hidden] {
            display: none;
        }
        .translation-nav span {
            min-width: 64px;
            text-align: center;
            font-size: 13px;
        }
        .status {
            color: #d5d8da;
            font-size: 13px;
            text-align: right;
        }
        .status[data-error="true"] {
            color: #ffb4ab;
        }
        .reader {
            width: min(900px, 100%);
            margin: 24px auto;
            padding: 0 20px;
        }
        .pdf-page {
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 0 0 20px;
            background: #fff;
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
        }
        .pdf-page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .text-layer {
            position: absolute;
            inset: 0 auto auto 0;
            overflow: hidden;
            line-height: 1;
            text-align: initial;
            text-size-adjust: none;
            transform: scale(var(--display-scale, 1));
            transform-origin: 0 0;
            color: transparent;
            forced-color-adjust: none;
        }
        .text-layer span {
            position: absolute;
            white-space: pre;
            color: transparent;
            cursor: text;
            transform-origin: 0 0;
        }
        .text-layer ::selection {
            background: rgba(0, 100, 255, .28);
        }
        .translation-page {
            margin: 0 0 20px;
            padding: 32px 40px;
            background: #fff;
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
            overflow-wrap: anywhere;
        }
        .translation-page h2 {
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5e7e9;
            color: #6b7074;
            font-size: 14px;
            font-weight: 500;
        }
        .translation-page p {
            min-height: 1em;
            margin: 0 0 8px;
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .reader[data-mode="translation"] .pdf-pages {
            display: none;
        }
        .placeholder {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #70767a;
            text-align: center;
            padding: 20px;
        }
        .placeholder p {
            margin-top: 10px;
            font-size: 14px;
        }
        [hidden] {
            display: none !important;
        }
        @media (max-width: 600px) {
            .toolbar {
                padding: 10px 12px;
                flex-wrap: wrap;
            }
            .toolbar h1 {
                font-size: 14px;
            }
            .status {
                width: 100%;
                text-align: left;
            }
            .toolbar-actions {
                flex-wrap: wrap;
            }
            .reader {
                margin: 12px auto;
                padding: 0 10px;
            }
            .translation-page {
                padding: 22px 18px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="toolbar">
        <h1>PDF 文本阅读器</h1>
        <div class="toolbar-actions">
            <div class="file-input-wrapper">
                <button class="btn" type="button">选择 PDF 文件</button>
                <input type="file" id="file-selector" accept="application/pdf,.pdf" aria-label="选择 PDF 文件">
            </div>
            <button class="btn" id="translation-toggle" type="button" aria-pressed="false" hidden>文本视图</button>
            <div class="translation-nav" id="translation-nav" hidden>
                <button class="btn" id="previous-page" type="button">上一页</button>
                <span id="page-counter" aria-live="polite"></span>
                <button class="btn" id="next-page" type="button">下一页</button>
            </div>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">选择 PDF 后将提取文本。</div>
    </div>
    
    <main class="reader" id="reader" data-mode="pdf">
        <div class="placeholder" id="placeholder-text">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <p>请从本地选择 PDF。</p>
        </div>
        <div class="pdf-pages" id="pages"></div>
        <div id="translation-pages" hidden></div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    const fileSelector = document.getElementById('file-selector');
    const pagesContainer = document.getElementById('pages');
    const translationPagesContainer = document.getElementById('translation-pages');
    const translationToggle = document.getElementById('translation-toggle');
    const translationNav = document.getElementById('translation-nav');
    const previousPageButton = document.getElementById('previous-page');
    const nextPageButton = document.getElementById('next-page');
    const pageCounter = document.getElementById('page-counter');
    const reader = document.getElementById('reader');
    const placeholderText = document.getElementById('placeholder-text');
    const status = document.getElementById('status');
    let loadId = 0;
    let pageObserver = null;
    let currentTranslationPage = 0;
    const translationPages = [];
    const renderTasks = new Set();
    const resizeObservers = new Set();

    function setStatus(message, isError) {
        status.textContent = message;
        status.dataset.error = isError ? 'true' : 'false';
    }

    function isCjk(text) {
        return /[\u2e80-\u9fff]/.test(text);
    }

    function getPageLines(items) {
        const lines = [];
        let line = [];
        let baseline = null;

        for (const item of items) {
            if (!('str' in item)) continue;
            const y = item.transform[5];
            const fontSize = Math.abs(item.transform[3]) || 10;

            if (line.length && (Math.abs(y - baseline) > Math.max(fontSize * 0.35, 2) || line[line.length - 1].hasEOL)) {
                lines.push(line);
                line = [];
            }
            if (!line.length) baseline = y;
            line.push(item);

            if (item.hasEOL) {
                lines.push(line);
                line = [];
                baseline = null;
            }
        }
        if (line.length) lines.push(line);
        return lines;
    }

    function lineToText(line) {
        return line.reduce((text, item, index) => {
            if (index === 0) return item.str;
            const previous = line[index - 1];
            const gap = item.transform[4] - (previous.transform[4] + previous.width);
            const needsSpace = gap > Math.max(Math.abs(item.transform[3]) * 0.2, 1)
                && !/\s$/.test(text)
                && !/^\s/.test(item.str)
                && !isCjk(text.slice(-1) + item.str.slice(0, 1));
            return text + (needsSpace ? ' ' : '') + item.str;
        }, '');
    }

    function appendTranslationPage(pageNumber, textContent) {
        const lines = getPageLines(textContent.items)
            .map(lineToText)
            .filter(line => line.trim());
        translationPages[pageNumber - 1] = { pageNumber, lines };
    }

    function findTextPage(startIndex, direction) {
        for (let index = startIndex; index >= 0 && index < translationPages.length; index += direction) {
            if (translationPages[index]?.lines.length) return index;
        }
        return -1;
    }

    function renderTranslationPage(pageIndex) {
        const page = translationPages[pageIndex];
        if (!page) return;
        currentTranslationPage = pageIndex;

        const section = document.createElement('section');
        section.className = 'translation-page';
        const heading = document.createElement('h2');
        heading.textContent = `第 ${page.pageNumber} 页`;
        section.appendChild(heading);

        if (!page.lines.length) {
            const message = document.createElement('p');
            message.textContent = '此页没有可提取的文字，可能是空白页或扫描图片。';
            section.appendChild(message);
        }
        for (const line of page.lines) {
            const paragraph = document.createElement('p');
            paragraph.textContent = line;
            section.appendChild(paragraph);
        }

        translationPagesContainer.replaceChildren(section);
        pageCounter.textContent = `${page.pageNumber} / ${translationPages.length}`;
        previousPageButton.disabled = findTextPage(pageIndex - 1, -1) === -1;
        nextPageButton.disabled = findTextPage(pageIndex + 1, 1) === -1;
        window.scrollTo(0, 0);
    }

    function appendPage(pageNumber, page, textContent, currentLoadId) {
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = Math.min(1.25, 850 / baseViewport.width);
        const viewport = page.getViewport({ scale });
        const section = document.createElement('section');
        section.className = 'pdf-page';
        section.setAttribute('aria-label', `PDF 第 ${pageNumber} 页`);
        section.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

        const canvas = document.createElement('canvas');
        canvas.setAttribute('aria-hidden', 'true');
        section.appendChild(canvas);

        const textLayer = document.createElement('div');
        textLayer.className = 'text-layer';
        textLayer.setAttribute('role', 'document');
        textLayer.style.width = `${viewport.width}px`;
        textLayer.style.height = `${viewport.height}px`;
        textLayer.style.setProperty('--scale-factor', String(scale));
        section.appendChild(textLayer);

        const updateTextScale = () => {
            textLayer.style.setProperty('--display-scale', String(section.clientWidth / viewport.width));
        };
        const resizeObserver = new ResizeObserver(updateTextScale);
        resizeObserver.observe(section);
        resizeObservers.add(resizeObserver);
        updateTextScale();

        const state = { rendered: false, renderTask: null, isVisible: false };
        const render = async () => {
            if (state.rendered || state.renderTask || currentLoadId !== loadId) return;
            const outputScale = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            const context = canvas.getContext('2d');
            const task = page.render({
                canvasContext: context,
                viewport,
                transform: outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0]
            });
            state.renderTask = task;
            renderTasks.add(task);
            try {
                await task.promise;
                if (currentLoadId === loadId && state.isVisible) {
                    state.rendered = true;
                } else {
                    canvas.width = 0;
                    canvas.height = 0;
                }
            } catch (error) {
                if (error.name !== 'RenderingCancelledException' && currentLoadId === loadId) {
                    setStatus(`第 ${pageNumber} 页渲染失败：${error.message}`, true);
                }
            } finally {
                renderTasks.delete(task);
                if (state.renderTask === task) state.renderTask = null;
            }
        };

        if (pageObserver) {
            pageObserver.observe(section);
        } else {
            state.isVisible = true;
            render();
        }

        pagesContainer.appendChild(section);
        appendTranslationPage(pageNumber, textContent);
        pdfjsLib.renderTextLayer({
            textContent,
            container: textLayer,
            viewport
        }).promise.catch(error => {
            if (currentLoadId === loadId) {
                setStatus(`第 ${pageNumber} 页文字层创建失败：${error.message}`, true);
            }
        });
        return { render, state, canvas, resizeObserver };
    }

    fileSelector.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const currentLoadId = ++loadId;
        currentTranslationPage = 0;
        reader.dataset.mode = 'pdf';
        translationPagesContainer.hidden = true;
        translationNav.hidden = true;
        translationToggle.hidden = true;
        translationToggle.setAttribute('aria-pressed', 'false');
        translationToggle.textContent = '文本视图';
        if (pageObserver) pageObserver.disconnect();
        pageObserver = null;
        for (const observer of resizeObservers) observer.disconnect();
        resizeObservers.clear();
        for (const task of renderTasks) task.cancel();
        renderTasks.clear();
        pagesContainer.replaceChildren();
        translationPagesContainer.replaceChildren();
        translationPages.length = 0;
        setStatus('正在读取 PDF…', false);

        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            placeholderText.hidden = false;
            setStatus('所选文件不是 PDF，请重新选择。', true);
            fileSelector.value = '';
            return;
        }

        if (!window.pdfjsLib) {
            placeholderText.hidden = false;
            setStatus('PDF 解析组件加载失败，请检查网络连接后刷新页面。', true);
            return;
        }

        try {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            if (currentLoadId !== loadId) return;

            let textItems = 0;
            if ('IntersectionObserver' in window) {
                pageObserver = new IntersectionObserver(entries => {
                    for (const entry of entries) {
                        const state = entry.target.pageState;
                        if (entry.isIntersecting) {
                            state.state.isVisible = true;
                            state.render();
                        } else {
                            state.state.isVisible = false;
                            if (state.state.rendered) {
                                state.canvas.width = 0;
                                state.canvas.height = 0;
                                state.state.rendered = false;
                            }
                        }
                    }
                }, { rootMargin: '1000px 0px' });
            }

            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                const page = await pdf.getPage(pageNumber);
                const textContent = await page.getTextContent();
                textItems += textContent.items.filter(item => item.str.trim()).length;
                const pageView = appendPage(pageNumber, page, textContent, currentLoadId);
                Object.assign(pagesContainer.lastElementChild, { pageState: pageView });
                if (currentLoadId !== loadId) return;
                setStatus(`正在准备页面… ${pageNumber}/${pdf.numPages} 页`, false);
            }

            placeholderText.hidden = true;
            translationToggle.hidden = !textItems;
            setStatus(
                textItems
                    ? `已载入 ${pdf.numPages} 页。PDF 视图保留原排版；如需文本，请切换到“文本视图”。`
                    : `已载入 ${pdf.numPages} 页，但未提取到文字；该 PDF 可能是扫描图片，需先进行 OCR。`,
                !textItems
            );
        } catch (error) {
            if (currentLoadId !== loadId) return;
            pagesContainer.replaceChildren();
            translationPagesContainer.replaceChildren();
            translationPages.length = 0;
            placeholderText.hidden = false;
            translationNav.hidden = true;
            translationToggle.hidden = true;
            setStatus(`无法读取该 PDF：${error.message || '文件可能已损坏或受密码保护。'}`, true);
        } finally {
            if (currentLoadId === loadId) fileSelector.value = '';
        }
    });

    translationToggle.addEventListener('click', () => {
        const showTranslation = reader.dataset.mode !== 'translation';
        reader.dataset.mode = showTranslation ? 'translation' : 'pdf';
        translationPagesContainer.hidden = !showTranslation;
        translationNav.hidden = !showTranslation;
        translationToggle.setAttribute('aria-pressed', String(showTranslation));
        translationToggle.textContent = showTranslation ? '返回 PDF 原版布局' : '文本视图';
        if (showTranslation) renderTranslationPage(findTextPage(0, 1));
        setStatus(
            showTranslation
                ? '当前仅显示一页普通网页文字；若插件无反应，请允许它访问 file:// 页面。'
                : '已返回 PDF 原版布局。可切换到文本视图。',
            false
        );
    });

    previousPageButton.addEventListener('click', () => {
        const previousPage = findTextPage(currentTranslationPage - 1, -1);
        if (previousPage !== -1) renderTranslationPage(previousPage);
    });

    nextPageButton.addEventListener('click', () => {
        const nextPage = findTextPage(currentTranslationPage + 1, 1);
        if (nextPage !== -1) renderTranslationPage(nextPage);
    });
</script>

</body>
</html>
